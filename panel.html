<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Requerimientos – JJC CC0154</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;}
.header{background:#161b22;border-bottom:1px solid #21262d;padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;}
.logo{width:36px;height:36px;background:#1a3a5c;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;}
.header h1{font-size:17px;font-weight:700;letter-spacing:1px;}
.header span{font-size:12px;color:#8b949e;}
.btn{padding:7px 14px;border:none;border-radius:5px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s;}
.btn:hover{opacity:.85;}
.btn-new{background:#27ae60;color:#fff;margin-left:auto;}
.btn-refresh{background:#2980b9;color:#fff;}
.main{max-width:1200px;margin:0 auto;padding:20px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:16px;text-align:center;}
.stat-num{font-size:28px;font-weight:700;margin-bottom:4px;}
.stat-label{font-size:12px;color:#8b949e;}
.s-total{color:#58a6ff;}
.s-pend{color:#d29922;}
.s-rev{color:#f97316;}
.s-apro{color:#3fb950;}
.s-aten{color:#8b949e;}
.filtros{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filtros select,.filtros input{background:#161b22;border:1px solid #21262d;border-radius:6px;padding:7px 12px;color:#e6edf3;font-size:13px;outline:none;}
.filtros select:focus,.filtros input:focus{border-color:#1a3a5c;}
.tbl-wrap{background:#161b22;border:1px solid #21262d;border-radius:10px;overflow:hidden;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:#1c2230;}
th{padding:10px 12px;text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8b949e;border-bottom:1px solid #21262d;white-space:nowrap;}
tbody tr{border-bottom:1px solid #21262d;transition:background .1s;cursor:pointer;}
tbody tr:hover{background:#1f2937;}
td{padding:10px 12px;vertical-align:middle;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-Pendiente{background:#2a1f0a;border:1px solid #d29922;color:#d29922;}
.b-En\ revisión{background:#1a1a2e;border:1px solid #f97316;color:#f97316;}
.b-Aprobado{background:#1a2a1a;border:1px solid #3fb950;color:#3fb950;}
.b-Atendido{background:#1a1a1a;border:1px solid #8b949e;color:#8b949e;}
.td-id{font-family:monospace;font-size:11px;color:#8b949e;}
.td-sol{font-weight:700;}
.td-items{text-align:center;background:#1c2230;font-weight:700;}
/* MODAL DETALLE */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;}
#modal.show{display:flex;}
.modal-box{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:24px;width:100%;max-width:800px;margin:auto;}
.modal-box h2{font-size:16px;font-weight:700;margin-bottom:16px;color:#58a6ff;}
.modal-header-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;font-size:12px;}
.mh-item{background:#0d1117;padding:8px;border-radius:6px;}
.mh-label{color:#8b949e;font-size:10px;margin-bottom:2px;}
.mh-val{font-weight:700;}
.modal-items{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px;}
.modal-items th{background:#1c2230;padding:7px 10px;text-align:left;color:#8b949e;font-size:10px;border-bottom:1px solid #21262d;}
.modal-items td{padding:7px 10px;border-bottom:1px solid #21262d;}
.modal-items tr:last-child td{border-bottom:none;}
.estado-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid #21262d;}
.estado-ctrl label{font-size:12px;color:#8b949e;}
.estado-ctrl select{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:7px 12px;color:#e6edf3;font-size:13px;outline:none;}
.estado-ctrl input{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:7px 12px;color:#e6edf3;font-size:12px;outline:none;flex:1;min-width:150px;}
.btn-save{background:#3fb950;color:#fff;}
.btn-close{background:#555;color:#fff;}
.empty{text-align:center;padding:60px 20px;color:#8b949e;}
#toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
</style>
</head>
<body>
<div class="header">
  <div class="logo">J</div>
  <div>
    <h1>PANEL DE REQUERIMIENTOS</h1>
    <span>JJC Contratistas · CC0154 Marcona</span>
  </div>
  <button class="btn btn-refresh" onclick="cargar()" style="margin-left:auto;">↻ Actualizar</button>
  <button class="btn btn-new" onclick="location.href='/'">+ Nuevo Requerimiento</button>
</div>

<div class="main">
  <div class="stats">
    <div class="stat-card"><div class="stat-num s-total" id="s-total">—</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num s-pend" id="s-pend">—</div><div class="stat-label">Pendientes</div></div>
    <div class="stat-card"><div class="stat-num s-rev" id="s-rev">—</div><div class="stat-label">En Revisión</div></div>
    <div class="stat-card"><div class="stat-num s-apro" id="s-apro">—</div><div class="stat-label">Aprobados</div></div>
  </div>

  <div class="filtros">
    <input type="text" id="buscar" placeholder="🔍 Buscar por solicitante, ID..." oninput="filtrar()" style="min-width:220px;">
    <select id="filtro-estado" onchange="filtrar()">
      <option value="">Todos los estados</option>
      <option>Pendiente</option>
      <option>En revisión</option>
      <option>Aprobado</option>
      <option>Atendido</option>
    </select>
    <span style="font-size:12px;color:#8b949e;" id="count-label"></span>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>ID / Fecha</th><th>Solicitante</th><th>Proyecto</th>
        <th>Tipo Mat.</th><th>Ítems</th><th>Estado</th><th>Obs. Gestión</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">No hay requerimientos registrados aún.</div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div id="modal">
  <div class="modal-box">
    <h2 id="m-titulo">Detalle del Requerimiento</h2>
    <div class="modal-header-grid" id="m-header"></div>
    <table class="modal-items">
      <thead><tr><th>#</th><th>Código SAP</th><th>Descripción</th><th>Cant.</th><th>UND.</th><th>Stock</th><th>A Comprar</th><th>Obs.</th></tr></thead>
      <tbody id="m-items"></tbody>
    </table>
    <div class="estado-ctrl">
      <label>Estado:</label>
      <select id="m-estado">
        <option>Pendiente</option>
        <option>En revisión</option>
        <option>Aprobado</option>
        <option>Atendido</option>
      </select>
      <label>Observación:</label>
      <input type="text" id="m-obs" placeholder="Comentario de gestión...">
      <button class="btn btn-save" onclick="guardarEstado()">✔ Guardar</button>
      <button class="btn btn-close" onclick="cerrarModal()">✕ Cerrar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let todos = [];
let selId = null;

async function cargar(){
  try{
    const r = await fetch('/api/requerimientos');
    todos = await r.json();
    filtrar();
    updateStats();
  } catch(e){ showToast('Error al cargar: '+e.message,'#c0392b'); }
}

function updateStats(){
  document.getElementById('s-total').textContent = todos.length;
  document.getElementById('s-pend').textContent = todos.filter(r=>r.estado==='Pendiente').length;
  document.getElementById('s-rev').textContent = todos.filter(r=>r.estado==='En revisión').length;
  document.getElementById('s-apro').textContent = todos.filter(r=>r.estado==='Aprobado').length;
}

function filtrar(){
  const q = document.getElementById('buscar').value.toLowerCase();
  const est = document.getElementById('filtro-estado').value;
  const filtered = todos.filter(r=>{
    const matchQ = !q || r.id.toLowerCase().includes(q) || (r.solicitante||'').toLowerCase().includes(q) || (r.proyecto||'').toLowerCase().includes(q);
    const matchE = !est || r.estado === est;
    return matchQ && matchE;
  });
  renderTabla(filtered);
  document.getElementById('count-label').textContent = `${filtered.length} requerimiento(s)`;
}

function renderTabla(lista){
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  if(!lista.length){ tbody.innerHTML=''; empty.style.display=''; return; }
  empty.style.display='none';
  tbody.innerHTML = lista.map(r=>`
    <tr onclick="abrirDetalle('${r.id}')">
      <td><div class="td-id">${r.id}</div><div style="font-size:11px;color:#8b949e;">${(r.fecha||r.creadoEn||'').substring(0,10)}</div></td>
      <td class="td-sol">${r.solicitante||'—'}</td>
      <td style="font-size:12px;">${r.proyecto||'—'}</td>
      <td style="font-size:11px;color:#8b949e;">${r.tipo_mat||'—'}</td>
      <td class="td-items">${(r.items||[]).length}</td>
      <td><span class="badge b-${r.estado}">${r.estado}</span></td>
      <td style="font-size:11px;color:#8b949e;max-width:150px;">${r.observacion_gestion||'—'}</td>
    </tr>`).join('');
}

function abrirDetalle(id){
  selId = id;
  const r = todos.find(x=>x.id===id);
  if(!r) return;
  document.getElementById('m-titulo').textContent = `Requerimiento ${r.id}`;
  document.getElementById('m-header').innerHTML = `
    <div class="mh-item"><div class="mh-label">SOLICITANTE</div><div class="mh-val">${r.solicitante||'—'}</div></div>
    <div class="mh-item"><div class="mh-label">FECHA</div><div class="mh-val">${r.fecha||'—'}</div></div>
    <div class="mh-item"><div class="mh-label">PROYECTO RQ</div><div class="mh-val">${r.proyecto||'—'}</div></div>
    <div class="mh-item"><div class="mh-label">TIPO MATERIAL</div><div class="mh-val">${r.tipo_mat||'—'}</div></div>
    <div class="mh-item"><div class="mh-label">CENTRO / ALMACÉN</div><div class="mh-val">${r.centro||'—'} / ${r.almacen||'—'}</div></div>
    <div class="mh-item"><div class="mh-label">PEP</div><div class="mh-val">${r.pep||'—'}</div></div>
  `;
  document.getElementById('m-items').innerHTML = (r.items||[]).map((it,i)=>`
    <tr>
      <td>${it.num||i+1}</td>
      <td style="font-family:monospace;color:#f97316;">${it.codigo||'—'}</td>
      <td>${it.descripcion||'—'}</td>
      <td style="text-align:center;">${it.cantidad||'—'}</td>
      <td style="text-align:center;">${it.um||'—'}</td>
      <td style="text-align:center;">${it.stock||'—'}</td>
      <td style="text-align:center;">${it.comprar||'—'}</td>
      <td style="font-size:11px;color:#8b949e;">${it.obs||'—'}</td>
    </tr>`).join('');
  document.getElementById('m-estado').value = r.estado || 'Pendiente';
  document.getElementById('m-obs').value = r.observacion_gestion || '';
  document.getElementById('modal').classList.add('show');
}

function cerrarModal(){ document.getElementById('modal').classList.remove('show'); selId=null; }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target===document.getElementById('modal')) cerrarModal(); });

async function guardarEstado(){
  if(!selId) return;
  const estado = document.getElementById('m-estado').value;
  const obs = document.getElementById('m-obs').value;
  try{
    const r = await fetch('/api/requerimientos',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:selId, estado, observacion:obs})
    });
    const data = await r.json();
    if(data.ok){
      const idx = todos.findIndex(x=>x.id===selId);
      if(idx>=0){ todos[idx].estado=estado; todos[idx].observacion_gestion=obs; }
      showToast('✓ Estado actualizado','#27ae60');
      filtrar(); updateStats(); cerrarModal();
    }
  } catch(e){ showToast('Error: '+e.message,'#c0392b'); }
}

function showToast(msg,bg='#27ae60'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.background=bg; t.style.color='#fff';
  t.style.opacity='1'; setTimeout(()=>t.style.opacity='0',2500);
}

cargar();
setInterval(cargar, 30000); // Auto-actualizar cada 30 seg
</script>
</body>
</html>
